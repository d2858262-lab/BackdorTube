name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Permission to gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Deploy APK to apk-bin Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p final_apk
          cp app/build/outputs/apk/debug/*.apk final_apk/BackdorTube.apk
          git checkout --orphan apk-bin
          git rm -rf .
          mv final_apk/* .
          rmdir final_apk
          git add BackdorTube.apk
          git commit -m "Build Success: BackdorTube APK [run #${{ github.run_number }}]"
          git push origin apk-bin --force
